name: floosy
description: "A financial management app for personal expenses and budgeting in Arabic and English."
publish_to: "none"

version: 1.0.5+11

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_bloc: ^9.1.1
  go_router: ^14.2.0
  freezed_annotation: 3.1.0

  # UI
  fl_chart: ^0.66.0

  # Local Database
  drift: 2.35.3
  sqlite3: 3.9.1
  flutter_secure_storage: 11.2.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Remote Database & Auth
  supabase_flutter: ^2.5.0

  # Android Permissions (SMS / Notifications)
  permission_handler: ^11.3.1

  # Storage & Security
  shared_preferences: ^2.2.3

  # Localization
  intl: any
  flutter_localizations:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3
  cryptography: ^2.9.0
  file_picker: 13.3.2
  logger: ^2.3.0

  # JSON serialization
  json_annotation: ^4.12.0
  image_picker: ^1.2.3
  local_auth: 3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: 4.0.3
  json_serializable: ^6.8.0
  drift_dev: 2.35.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

    # Assets
  assets:
    - assets/banks/
    - assets/data/bank_sms_corpus.json
    - assets/translations/app_en.arb
    - assets/translations/app_ar.arb
    - assets/logo/floosy.png
    - assets/logo/floosy_symbol.png

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/floosy_symbol.png"
  adaptive_icon_foreground_inset: 18
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/logo/floosy_symbol.png"
    icon_size: 48
  image_path: "assets/logo/floosy_symbol.png"

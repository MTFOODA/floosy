name: floosy
description: "A financial management app for personal expenses and budgeting in Arabic and English."
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_bloc: ^9.1.1
  go_router: ^14.2.0
  freezed_annotation: ^2.4.1

  # UI
  fl_chart: ^0.66.0

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.1
  path: ^1.9.0

  # Remote Database & Auth
  supabase_flutter: ^2.5.0

  # Android Permissions (SMS / Notifications)
  permission_handler: ^11.3.1

  # Storage & Security
  shared_preferences: ^2.2.3

  # Localization
  intl: any
  flutter_localizations:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3
  logger: ^2.3.0

  # JSON serialization
  json_annotation: ^4.9.0
  image_picker: ^1.2.3
  local_auth: 3.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

    # Assets
  assets:
    - assets/translations/app_en.arb
    - assets/translations/app_ar.arb
    - assets/logo/floosy.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/logo/floosy.png"
    icon_size: 48
  image_path: "assets/logo/floosy.png"

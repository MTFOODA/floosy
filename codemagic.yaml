workflows:
  ios-simulator:
    name: Floosy iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build for iOS Simulator
        script: flutter build ios --simulator --debug
      - name: Package app for Appetize
        script: |
          set -e
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            artifacts/floosy-ios-simulator.zip
    artifacts:
      - artifacts/floosy-ios-simulator.zip

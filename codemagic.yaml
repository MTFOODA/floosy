workflows:
  ios-simulator:
    name: Floosy iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build for iOS Simulator
        script: flutter build ios --simulator --debug
      - name: Package app for Appetize
        script: |
          set -e
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            artifacts/floosy-ios-simulator.zip
    artifacts:
      - artifacts/floosy-ios-simulator.zip

  ios-device-unsigned:
    name: Floosy iPhone - Sign on Windows
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release for a physical iPhone
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for local signing
        script: |
          set -e
          mkdir -p artifacts/Payload
          ditto build/ios/iphoneos/Runner.app artifacts/Payload/Runner.app
          ditto -c -k --keepParent \
            artifacts/Payload \
            artifacts/floosy-iphone-unsigned.ipa
    artifacts:
      - artifacts/floosy-iphone-unsigned.ipa
